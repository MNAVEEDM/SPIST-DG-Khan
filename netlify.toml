# Netlify build settings for the SPIST website (frontend only).
#
# The Express API in server/ does NOT run here - Netlify serves static files.
# It is deployed separately; VITE_API_BASE_URL points the built site at it and
# is baked in at build time, so changing it needs a fresh build.
#
# Redirects live in public/_redirects, not here: rules in this file take
# precedence over that one, and splitting them between the two silently breaks
# the ordering they depend on.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
