<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Decorative institutional banner background">
  <defs>
    <linearGradient id="bbase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07281a"/>
      <stop offset="55%" stop-color="#0e4229"/>
      <stop offset="100%" stop-color="#186F42"/>
    </linearGradient>

    <radialGradient id="bglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#56A975" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#56A975" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bleft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04170e" stop-opacity="0.88"/>
      <stop offset="45%" stop-color="#04170e" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#04170e" stop-opacity="0"/>
    </linearGradient>

    <pattern id="bdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bbase)"/>
  <rect width="1600" height="400" fill="url(#bdots)"/>
  <ellipse cx="1300" cy="120" rx="560" ry="300" fill="url(#bglow)"/>

  <!-- Quiet contour lines only — no building, so page titles stay dominant -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1.5">
    <path d="M-40 300 C 260 262, 470 328, 760 288 S 1240 214, 1640 268"/>
    <path d="M-40 344 C 260 306, 470 372, 760 332 S 1240 258, 1640 312"/>
  </g>

  <!-- Single restrained orbital motif, far right -->
  <g transform="translate(1416 176)" fill="none" stroke="#ffffff">
    <g stroke-opacity="0.13" stroke-width="2">
      <ellipse rx="132" ry="49"/>
      <ellipse rx="132" ry="49" transform="rotate(60)"/>
      <ellipse rx="132" ry="49" transform="rotate(120)"/>
    </g>
    <circle r="10" fill="#56A975" fill-opacity="0.42" stroke="none"/>
    <circle cx="132" cy="0" r="6" fill="#9D120F" fill-opacity="0.5" stroke="none"/>
    <circle cx="-66" cy="42.4" r="6" fill="#ffffff" fill-opacity="0.34" stroke="none"/>
  </g>

  <rect width="1600" height="400" fill="url(#bleft)"/>
</svg>
