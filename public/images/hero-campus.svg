<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a university building with an atomic motif">
  <defs>
    <!-- Base gradient mesh: deepest at the left where the headline sits -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07281a"/>
      <stop offset="45%" stop-color="#0d3d26"/>
      <stop offset="100%" stop-color="#186F42"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#56A975" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#56A975" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7fd0a0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7fd0a0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9D120F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9D120F" stop-opacity="0"/>
    </radialGradient>

    <!-- Keeps the left third quiet and dark so white text stays legible -->
    <linearGradient id="leftVignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04170e" stop-opacity="0.92"/>
      <stop offset="38%" stop-color="#04170e" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#04170e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#04170e" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04170e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04170e" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Fine dot grid -->
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>

    <!-- Diagonal hatch -->
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- ---------- Base ---------- -->
  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#hatch)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- ---------- Soft atmospheric glows ---------- -->
  <ellipse cx="1290" cy="250" rx="620" ry="470" fill="url(#glowA)"/>
  <ellipse cx="1520" cy="700" rx="480" ry="380" fill="url(#glowB)"/>
  <ellipse cx="980" cy="880" rx="520" ry="300" fill="url(#glowC)"/>

  <!-- ---------- Contour / topographic lines ---------- -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5">
    <path d="M-40 690 C 220 640, 430 706, 700 664 S 1180 578, 1640 632"/>
    <path d="M-40 738 C 220 688, 430 754, 700 712 S 1180 626, 1640 680"/>
    <path d="M-40 786 C 220 736, 430 802, 700 760 S 1180 674, 1640 728"/>
    <path d="M-40 834 C 220 784, 430 850, 700 808 S 1180 722, 1640 776"/>
  </g>

  <!-- ---------- Campus building (line art) ---------- -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wings -->
    <g stroke-opacity="0.16" stroke-width="2">
      <path d="M846 620 h118 v104 H846 z"/>
      <path d="M1288 620 h118 v104 h-118 z"/>
      <path d="M868 648 v52 M898 648 v52 M928 648 v52"/>
      <path d="M1324 648 v52 M1354 648 v52 M1384 648 v52"/>
    </g>

    <!-- Steps -->
    <g stroke-opacity="0.22" stroke-width="2">
      <path d="M940 724 h372"/>
      <path d="M952 708 h348"/>
      <path d="M964 692 h324"/>
    </g>

    <!-- Colonnade -->
    <g stroke-opacity="0.26" stroke-width="2.5">
      <path d="M990 560 v132 M1042 560 v132 M1094 560 v132 M1158 560 v132 M1210 560 v132 M1262 560 v132"/>
      <!-- capitals + bases -->
      <path d="M982 560 h16 M1034 560 h16 M1086 560 h16 M1150 560 h16 M1202 560 h16 M1254 560 h16" stroke-opacity="0.20"/>
      <path d="M982 692 h16 M1034 692 h16 M1086 692 h16 M1150 692 h16 M1202 692 h16 M1254 692 h16" stroke-opacity="0.20"/>
    </g>

    <!-- Central arched doorway -->
    <g stroke-opacity="0.20" stroke-width="2">
      <path d="M1112 692 v-70 a14 14 0 0 1 28 0 v70"/>
    </g>

    <!-- Entablature -->
    <g stroke-opacity="0.30" stroke-width="2.5">
      <path d="M964 560 h324"/>
      <path d="M958 538 h336"/>
    </g>

    <!-- Pediment -->
    <g stroke-opacity="0.32" stroke-width="2.5">
      <path d="M958 538 L1126 458 L1294 538"/>
      <circle cx="1126" cy="512" r="14" stroke-opacity="0.22" stroke-width="2"/>
    </g>

    <!-- Drum + dome -->
    <g stroke-opacity="0.30" stroke-width="2.5">
      <path d="M1078 458 h96"/>
      <path d="M1084 458 v-38 M1126 458 v-38 M1168 458 v-38"/>
      <path d="M1078 420 h96"/>
      <path d="M1080 420 a46 52 0 0 1 92 0"/>
      <path d="M1126 368 v-26"/>
      <circle cx="1126" cy="336" r="7" stroke-opacity="0.34" stroke-width="2"/>
    </g>
  </g>

  <!-- ---------- Atomic / orbital motif ---------- -->
  <g transform="translate(1372 214)" fill="none" stroke="#ffffff">
    <g stroke-opacity="0.17" stroke-width="2">
      <ellipse rx="168" ry="62"/>
      <ellipse rx="168" ry="62" transform="rotate(60)"/>
      <ellipse rx="168" ry="62" transform="rotate(120)"/>
    </g>
    <circle r="13" fill="#56A975" fill-opacity="0.5" stroke="none"/>
    <circle cx="168" cy="0" r="8" fill="#9D120F" fill-opacity="0.62" stroke="none"/>
    <circle cx="-84" cy="53.7" r="8" fill="#ffffff" fill-opacity="0.42" stroke="none"/>
    <circle cx="-84" cy="-53.7" r="8" fill="#56A975" fill-opacity="0.62" stroke="none"/>
  </g>

  <!-- Small secondary molecule, lower right -->
  <g transform="translate(1468 606)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.8" fill="none">
    <path d="M0 0 L62 -34 M0 0 L-58 -26 M0 0 L16 62"/>
    <circle r="9"/>
    <circle cx="62" cy="-34" r="7"/>
    <circle cx="-58" cy="-26" r="7"/>
    <circle cx="16" cy="62" r="7"/>
  </g>

  <!-- ---------- Legibility overlays ---------- -->
  <rect width="1600" height="900" fill="url(#leftVignette)"/>
  <rect width="1600" height="900" fill="url(#bottomFade)"/>
</svg>
